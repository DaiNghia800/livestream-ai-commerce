# CI pipeline — livestream-ai-commerce
# Trigger: mọi push và pull_request vào dev hoặc main
# Jobs chạy song song để tiết kiệm thời gian

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Nếu có push mới lên cùng branch đang có CI chạy → hủy CI cũ, chạy CI mới
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────
  # JOB 1: Kiểm tra format commit message
  # Áp dụng Conventional Commits: feat/fix/docs/refactor/test/chore
  # ─────────────────────────────────────────────────────────────────
  commit-lint:
    name: "Commit message lint"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # Cần fetch đủ commit history để commitlint so sánh được
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install commitlint
        run: npm install @commitlint/cli @commitlint/config-conventional

      # # Lint tất cả commit trong PR này (từ base đến HEAD)
      # - name: Lint commits in this PR
      #   run: |
      #     npx commitlint \
      #       --from ${{ github.event.pull_request.base.sha }} \
      #       --to   ${{ github.event.pull_request.head.sha }} \
      #       --verbose

      # đoạn này thay cho code đã comment lại ở trên
      # Chỉ lint commit thực sự viết trên nhánh này.
      # Commit đã có trên main là lịch sử khởi tạo repo, có từ trước khi
      # nhóm áp Conventional Commits và đã publish nên không sửa được.
      - name: Lint commits in this PR
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

          COMMITS=$(git log --format=%H \
            ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} \
            --not origin/main --no-merges)

          if [ -z "$COMMITS" ]; then
            echo "Không có commit mới nào cần kiểm tra."
            exit 0
          fi

          FAILED=0
          for sha in $COMMITS; do
            echo "── $(git log -1 --format='%h %s' "$sha")"
            git log -1 --format=%B "$sha" | npx commitlint --verbose || FAILED=1
          done
          exit $FAILED


  # ─────────────────────────────────────────────────────────────────
  # JOB 2: Quét lộ secret (API key, password, token...)
  # Dùng Gitleaks — tool phổ biến nhất, free, chạy trên toàn history
  # ─────────────────────────────────────────────────────────────────
  secret-scan:
    name: "Secret scan (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Cần full history để quét toàn bộ git log

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # Không cần GITHUB_TOKEN trả phí, chỉ dùng để post comment PR
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────────
  # JOB 3: Kiểm tra chất lượng code Next.js
  # TypeScript strict mode + ESLint (Next.js core-web-vitals rules)
  # ─────────────────────────────────────────────────────────────────
  web-quality:
    name: "Web — TypeScript & ESLint"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Kiểm tra TypeScript: không có any lỗi type nào được phép
      - name: TypeScript typecheck
        run: npm run typecheck

      # ESLint: áp dụng rules của Next.js (core-web-vitals + typescript)
      - name: ESLint
        run: npm run lint

  # ─────────────────────────────────────────────────────────────────
  # JOB 4: Build Next.js + chạy Playwright E2E tests
  # Playwright tự khởi động Next.js server -> chạy test -> tắt
  # ─────────────────────────────────────────────────────────────────
  web-e2e:
    name: "Web — Playwright E2E"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Cache Playwright browsers để không tải lại mỗi lần (~300MB)
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Build production bundle trước khi test
      # (playwright.config.ts chạy `npm run start` chứ không phải `npm run dev`)
      - name: Build Next.js
        run: npm run build

      # Chạy tất cả test trong tests/ trên 2 project: desktop + mobile
      - name: Run Playwright tests
        run: npm test

      # Upload kết quả test (screenshots, traces) để xem khi fail
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # JOB 5: Chạy unit tests cho AI Worker (Python + pytest)
  # Kiểm tra logic validate event và parse purchase intent
  # ─────────────────────────────────────────────────────────────────
  ai-worker-test:
    name: "AI Worker — Pytest"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # Install dependencies from requirements.txt
      - name: Install test dependencies
        run: pip install -r services/ai-worker/requirements.txt

      # Run all AI Worker tests with verbose output
      - name: Run AI Worker tests
        run: python -m pytest tests/ai-worker/ -v --tb=short


  commerce-test:
    name: "Commerce — Vitest"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: commerce_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/commerce_db

    defaults:
      run:
        working-directory: services/commerce

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/commerce/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Migration chạy tự động lúc server khởi động, nhưng test gọi thẳng
      # repository nên phải dựng schema trước bằng chính runner đó.
      - name: Run migrations
        run: npx tsx --eval "import('./src/shared/database/database.js').then(m => m.runMigrations()).then(() => process.exit(0))"

      - name: TypeScript typecheck
        run: npm run typecheck

      # Dùng test:coverage chứ không phải test: ngưỡng 90% khai trong
      # vitest.config.ts chỉ có tác dụng khi chạy kèm --coverage. Chạy
      # `npm test` suông thì độ phủ trôi dần theo từng PR mà CI vẫn xanh.
      - name: Run Commerce tests with coverage gate
        run: npm run test:coverage
