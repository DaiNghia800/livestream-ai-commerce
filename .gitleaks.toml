# Cấu hình Gitleaks — job "Secret scan" trong .github/workflows/ci.yml
#
# Giữ NGUYÊN bộ luật mặc định, chỉ thêm ngoại lệ. Tắt luật hoặc nới
# rộng đường dẫn là cách nhanh nhất biến job này thành vô dụng: nó
# vẫn xanh, nhưng không còn chặn được gì.

[extend]
useDefault = true

[allowlist]
description = """
Fixture của test giao diện: toàn giá trị BỊA cho Playwright dựng màn
hình, không có khoá thật nào.

Luật generic-api-key bắt theo "từ khoá gợi ý + chuỗi entropy cao", nên
một mã vận đơn giả như tok-abcdef0123456789abcdef trông y hệt khoá
thật dưới mắt máy quét.

Cố ý chỉ mở ĐÚNG CÁC FILE CẦN THIẾT chứ không mở cả thư mục tests/. Test là chỗ
người ta hay dán khoá thật vào để thử cho nhanh rồi quên xoá — mở cả
thư mục là đúng lúc cần chặn nhất thì không chặn nữa.
"""
paths = [
  '''apps/web/tests/fixtures/api\.ts''',
  '''services/commerce/tests/unit/orders/ai-results-consumer\.job\.test\.ts''',
]
